<!-- templates/voice_chat.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Voice Chat with {{ display_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='voicechatStyle.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="personName">{{ person_id }}</h1>
            <p>AI Companion • Available</p>
        </header>

        <div class="mic-area">
            <div class="mic-icon" id="micBtn"></div>
            <p>Tap and hold to speak</p>
        </div>

        <div style="margin: 10px 0;">
            <label for="languageSelect"><b>Select Language:</b></label>
            <select id="languageSelect">
                <option value="en-US">English (US)</option>
                <option value="hi-IN">Hindi (India)</option>
                <option value="es-ES">Spanish (Spain)</option>
                <option value="fr-FR">French (France)</option>
                <option value="de-DE">German (Germany)</option>
                <option value="ja-JP">Japanese (Japan)</option>
                <option value="zh-CN">Chinese (Mandarin)</option>
                <option value="ar-SA">Arabic (Saudi Arabia)</option>
                <!-- Add more as needed -->
            </select>
        </div>

        <div class="chatbox" id="chatBox">
            <!-- Messages will appear here -->
        </div>

        <footer>
            <button id="micToggle" class="record-btn">🎤 Hold to Talk</button>
            <p id="statusText">Ready</p>
        </footer>
    </div>

    <script>
        const personId = document.getElementById("personName").innerText;
        const micToggle = document.getElementById("micToggle");
        const chatBox = document.getElementById("chatBox");
        const statusText = document.getElementById("statusText");
        const languageSelect = document.getElementById("languageSelect");

        let recognition;
        let recognizing = false;

        if (!("webkitSpeechRecognition" in window)) {
            statusText.innerText = "Speech Recognition not supported.";
        } else {
            recognition = new webkitSpeechRecognition();
            recognition.lang = languageSelect.value;  // Default language
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                recognizing = true;
                statusText.innerText = "Listening...";
            };

            recognition.onresult = event => {
                const transcript = event.results[0][0].transcript;
                statusText.innerText = "Processing...";

                const userDiv = document.createElement("div");
                userDiv.innerHTML = `<b>You:</b> ${transcript}`;
                chatBox.appendChild(userDiv);

                const formData = new FormData();
                formData.append("text", transcript);
                formData.append("person_id", personId);

                fetch("/voice_input", {
                    method: "POST",
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    const aiDiv = document.createElement("div");
                    aiDiv.innerHTML = `<b>${personId}:</b> ${data.response}`;
                    chatBox.appendChild(aiDiv);

                    const audio = new Audio(data.audio_url);
                    audio.play();
                    statusText.innerText = "Ready";
                })
                .catch(err => {
                    console.error(err);
                    statusText.innerText = "Error. Try again.";
                });
            };

            recognition.onerror = e => {
                console.error(e);
                statusText.innerText = "Recognition error.";
            };

            recognition.onend = () => {
                recognizing = false;
            };

            // Change recognition language on dropdown change
            languageSelect.addEventListener("change", () => {
                recognition.lang = languageSelect.value;
            });
        }

        micToggle.addEventListener("click", () => {
            if (recognizing) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });
    </script>
</body>
</html>
